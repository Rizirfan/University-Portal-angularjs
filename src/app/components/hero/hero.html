@if (image()) {
  <div class="bg-gradient-to-br from-primary via-primary-dark to-slate-900">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-14">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12 items-center">
        <div>
          <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-white tracking-tight leading-tight">
            {{ title() }}
          </h1>
          @if (subtitle()) {
            <p class="text-sm sm:text-base text-gray-300 mt-4 leading-relaxed max-w-lg">{{ subtitle() }}</p>
          }
          @if (ctaLabel() && ctaLink()) {
            <a [routerLink]="ctaLink()"
               class="inline-flex items-center gap-2 mt-6 px-6 py-3 bg-accent hover:bg-accent/90 text-white font-extrabold text-sm rounded transition-colors shadow-lg">
              {{ ctaLabel() }}
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
              </svg>
            </a>
          }
        </div>
        <div class="hidden md:flex justify-end">
          <img [src]="image()" alt="University campus" class="w-full max-w-md rounded shadow-2xl object-cover h-72 border border-white/10" />
        </div>
      </div>
    </div>
  </div>
} @else {
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-4 sm:pt-6 pb-2">
    <h1 class="text-xl sm:text-2xl md:text-3xl font-extrabold text-gray-900 tracking-tight leading-tight">
      {{ title() }}
    </h1>
    @if (subtitle()) {
      <p class="text-xs sm:text-sm text-gray-500 font-medium mt-1 leading-snug">{{ subtitle() }}</p>
    }
  </div>
}
