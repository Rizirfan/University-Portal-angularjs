<nav class="bg-primary text-white shadow-lg sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-14 sm:h-16">
      <a routerLink="/" class="flex items-center gap-1.5 sm:gap-2 font-bold text-base sm:text-xl tracking-tight min-w-0 shrink-0" (click)="closeMobile()">
        <svg class="w-6 h-6 sm:w-8 sm:h-8 text-accent-light shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M12 14l9-5-9-5-9 5 9 5z" />
          <path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222" />
        </svg>
        <span class="truncate hidden sm:inline">University Portal</span>
        <span class="truncate sm:hidden">Portal</span>
      </a>

      <div class="hidden md:flex items-center gap-1">
        @for (link of navLinks; track link.path) {
          <a [routerLink]="link.path"
             routerLinkActive="bg-primary-light"
             [routerLinkActiveOptions]="{ exact: link.exact }"
             class="px-3 py-2 rounded text-sm font-medium hover:bg-primary-light transition-colors">
            {{ link.label }}
          </a>
        }

        <!-- Student Login Button -->
        <a routerLink="/student"
           class="ml-2 px-3.5 py-1.5 bg-accent hover:bg-accent/90 text-white text-xs font-extrabold rounded transition-colors flex items-center gap-1.5 shadow-sm">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <span>Student Login</span>
        </a>
      </div>

      <button (click)="toggleMobile()" class="md:hidden p-2 rounded hover:bg-primary-light transition-colors">
        @if (mobileOpen()) {
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        } @else {
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        }
      </button>
    </div>
  </div>

  @if (mobileOpen()) {
    <div class="md:hidden border-t border-primary-light">
      <div class="px-2 pt-2 pb-3 space-y-1">
        @for (link of navLinks; track link.path) {
          <a [routerLink]="link.path"
             routerLinkActive="bg-primary-light"
             [routerLinkActiveOptions]="{ exact: link.exact }"
             (click)="closeMobile()"
             class="block px-3 py-2 rounded text-base font-medium hover:bg-primary-light transition-colors">
            {{ link.label }}
          </a>
        }
        <a routerLink="/student"
           (click)="closeMobile()"
           class="block px-3 py-2 rounded text-base font-extrabold bg-accent text-white flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          Student Login & Profile
        </a>
      </div>
    </div>
  }
</nav>
