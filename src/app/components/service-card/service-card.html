<a [routerLink]="link()" class="h-full flex flex-col justify-between bg-white rounded shadow-sm hover:shadow-xl transition-all p-6 border border-gray-100 hover:border-accent group relative overflow-hidden">
  <div>
    <div class="w-12 h-12 bg-accent/10 rounded-md flex items-center justify-center mb-4 group-hover:bg-accent group-hover:text-white transition-all shadow-xs">
      <svg class="w-6 h-6 text-accent group-hover:text-white transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="icon()" />
      </svg>
    </div>
    <h3 class="text-lg font-extrabold text-gray-800 mb-2 group-hover:text-accent transition-colors leading-tight">
      {{ title() }}
    </h3>
    @if (description()) {
      <p class="text-gray-500 text-xs leading-relaxed font-medium line-clamp-3">
        {{ description() }}
      </p>
    }
  </div>

  <div class="pt-4 mt-4 border-t border-gray-100 flex items-center justify-between text-xs font-bold text-accent group-hover:text-accent-dark">
    <span>Access Service</span>
    <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
    </svg>
  </div>
</a>
